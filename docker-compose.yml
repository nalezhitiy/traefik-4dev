services:

  traefik:
    image: traefik:3.7
    
    command:
      - --log.level=DEBUG
      - --api.dashboard=true

      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik-4dev_network

      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true

      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true

    ports:
      - "${TRAEFIK_IP}:80:80"
      - "${TRAEFIK_IP}:443:443"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik-4dev_certs:/certs:ro

    networks:
      traefik-4dev_network:
        ipv4_address: ${TRAEFIK_IP}

    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`${BASE_DOMAIN}`)
      - traefik.http.routers.dashboard.entrypoints=websecure
      - traefik.http.routers.dashboard.service=api@internal
      - traefik.http.routers.dashboard.tls=true


  dns:
    build: ./dns
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN}
      DESTINATION_IP: ${TRAEFIK_IP}

    ports:
      - "53:53/udp"
      - "53:53/tcp"

    networks:
      traefik-4dev_network:
        ipv4_address: ${DNS_IP}


networks:
  traefik-4dev_network:
    name: traefik-4dev_network
    driver: bridge
    ipam:
      config:
        - subnet: ${SUBNET_IP}/24


volumes:
  traefik-4dev_certs:
    name: traefik-4dev_certs
    external: true